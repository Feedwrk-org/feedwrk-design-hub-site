<!DOCTYPE html>
<!--
  The sign-in page of designsystem.feedwrk.com, in the workspace design system. It is StatiCrypt 3.5.4's own
  password template (lib/password_template.html) with the markup and styles replaced and the script kept: every
  [|placeholder|] and element id the StatiCrypt script reads is still here. The only script changes are the ones the
  new markup needs: the show/hide button, the inline error in place of the browser alert dialog, and clearing the logout fragment.

  scripts/publish-site.mjs renders this file before StatiCrypt reads it (renderSigninTemplate). Two kinds of
  double-brace token are filled there: the theme-boot token becomes the portal's own set-the-theme-before-paint script
  (portal/scripts/theme-boot.mjs), and each icon token (icon, a colon, a Lucide name) becomes that icon from
  lucide-static 0.575.0, inlined because this page stands alone.
  The two stylesheets are public, unencrypted files on the same site, so they load before anyone signs in.
-->
<html class="staticrypt-html" lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <title>Sign in · Feedwrk design hub</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <!-- StatiCrypt fills these two; the page's own colours are the workspace tokens: #0074c9 #f5f5f7 -->

        <!-- First paint, in this order: the theme boot, then the theme's background inline. A remembered session replaces
             this page within a moment; until then it is an empty page on the theme's own background, so navigating never
             flashes white. The two system stylesheets (tokens.css, bundle.css) are NOT linked here: a stylesheet link blocks
             the script below, and with it the decryption, until the stylesheet has downloaded, and the decrypted page
             loads them itself. They are added by the script only when the sign-in card has to be shown. -->
        <script>(function(){var c="device";try{var v=localStorage.getItem("hub-theme");if(v==="light"||v==="dark"||v==="device")c=v}catch(e){}var d=c==="dark"||(c==="device"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light")})()</script>
        <style>html,body{margin:0;background:#f5f5f7}html[data-theme="dark"] body,html[data-theme="dark"]{background:#0d0d0f}html{color-scheme:light dark}</style>
        <!-- Warm the cache for the decrypted page: a preload does not block the decrypt script (a stylesheet link would). -->
        <link rel="preload" as="style" href="/hub/workspace/tokens.css" />
        <link rel="preload" as="style" href="/hub/workspace/components/bundle.css" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <style>
            /* Page: the system's canvas, the card centred in it with a 16px gutter (space-4). */
            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                min-height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: var(--space-4);
            }

            /* The card: a Panel (surface, radius-panel, shadow-panel: a hairline and a 1px lift), dialog width. */
            .staticrypt-card {
                width: 100%;
                max-width: var(--size-dialog);
                padding: var(--space-6);
                display: flex;
                flex-direction: column;
                gap: var(--space-5);
            }

            /* Brand row: the mark file, a space-2 gap, the wordmark file; the wordmark is swapped by the resolved theme. */
            .staticrypt-brand {
                display: flex;
                align-items: center;
                gap: var(--space-2);
            }

            .staticrypt-mark {
                display: block;
                width: var(--space-6);
                height: var(--space-6);
                flex: none;
            }

            .staticrypt-logo {
                display: block;
                height: calc(var(--space-4) - var(--space-1) / 2);
                width: auto;
            }

            html[data-theme="dark"] .staticrypt-logo-light {
                display: none;
            }

            html:not([data-theme="dark"]) .staticrypt-logo-dark {
                display: none;
            }

            .staticrypt-title {
                margin: 0;
            }

            .staticrypt-form {
                display: flex;
                flex-direction: column;
                gap: var(--space-4);
            }

            /* Field: label above, the input with the show/hide button inside its trailing edge. */
            .staticrypt-field {
                position: relative;
                display: block;
            }

            .staticrypt-field .fw-field {
                padding-right: var(--size-touch);
            }

            .staticrypt-toggle-password-visibility {
                position: absolute;
                top: 50%;
                right: var(--space-1);
                transform: translateY(-50%);
            }

            .staticrypt-toggle-password-visibility svg {
                width: var(--space-4);
                height: var(--space-4);
            }

            /* Remember: the system Checkbox. A real input drives it (the script reads it); the box is the system's. */
            .staticrypt-remember {
                position: relative;
            }

            .staticrypt-remember input[type="checkbox"] {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                opacity: 0;
                cursor: pointer;
            }

            .staticrypt-remember input[type="checkbox"]:checked + .fw-check {
                background: var(--primary);
                border-color: var(--primary);
            }

            .staticrypt-remember input[type="checkbox"]:not(:checked) + .fw-check svg {
                display: none;
            }

            .staticrypt-remember input[type="checkbox"]:focus-visible + .fw-check {
                outline: 2px solid var(--ring);
                outline-offset: 2px;
            }

            /* What the checkbox means, right under it (Field README: one short line where a label could be misread). */
            .staticrypt-remember-help {
                margin: calc(-1 * var(--space-2)) 0 0;
            }

            .staticrypt-decrypt-button {
                width: 100%;
            }

            .hidden {
                display: none !important;
            }

            /* Touch targets are 44px (size-touch) on coarse pointers. */
            @media (pointer: coarse) {
                .staticrypt-card .fw-field,
                .staticrypt-card .fw-btn,
                .staticrypt-card .fw-cbrow {
                    min-height: var(--size-touch);
                }

                .staticrypt-toggle-password-visibility {
                    min-width: var(--size-touch);
                    min-height: var(--size-touch);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                    animation: none !important;
                }
            }
        </style>
    </head>

    <body class="fw-root staticrypt-body">

                        <label class="fw-label" for="staticrypt-password">Team password</label>

                            <input

                                type="button"
                                class="fw-btn ghost icon sm staticrypt-toggle-password-visibility"

                                <span id="staticrypt-eye"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
  <circle cx="12" cy="12" r="3" /></svg></span>
                                <span id="staticrypt-eye-off" hidden><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
  <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
  <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" />
  <path d="m2 2 20 20" /></svg></span>
                            </button>
                        </div>
                        <p id="staticrypt-error" class="fw-error" role="alert" hidden>
                            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
  <path d="M12 9v4" />
  <path d="M12 17h.01" /></svg><span id="staticrypt-error-text"></span>
                        </p>
                    </div>

                    <label id="staticrypt-remember-label" class="staticrypt-remember fw-cbrow hidden">
                        <input id="staticrypt-remember" type="checkbox" name="remember" aria-describedby="staticrypt-remember-help" />
                        <span class="fw-check"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg></span>
                        Keep me signed in on this device

                    <p id="staticrypt-remember-help" class="fw-help staticrypt-remember-help hidden"></p>

                    <button type="submit" class="fw-btn default staticrypt-decrypt-button">Sign in</button>
                </form>

            const templateConfig = {

                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            const passwordInput = document.getElementById("staticrypt-password");
            const errorBox = document.getElementById("staticrypt-error");

            // the field error (Field README): destructive text under the field with its icon, the field marked invalid
            function setError(on) {
                errorBox.hidden = !on;
                passwordInput.classList.toggle("is-error", on);
                if (on) {
                    passwordInput.setAttribute("aria-invalid", "true");
                } else {
                    passwordInput.removeAttribute("aria-invalid");

            document.getElementById("staticrypt-error-text").textContent = templateError;
            passwordInput.addEventListener("input", function () {
                setError(false);
            });

            // The workspace stylesheets (public, unencrypted files on this site), loaded only when the card must be shown.
            // Resolves when both are in (or after a few seconds, so a failed download cannot leave the page blank).
            function loadStyles() {
                const urls = ["/hub/workspace/tokens.css", "/hub/workspace/components/bundle.css"];
                return new Promise(function (resolve) {
                    let pending = urls.length;
                    const done = function () {
                        pending -= 1;
                        if (pending === 0) resolve();
                    };
                    setTimeout(resolve, 4000);
                    urls.forEach(function (href) {
                        const link = document.createElement("link");
                        link.rel = "stylesheet";
                        link.href = href;
                        link.addEventListener("load", done);
                        link.addEventListener("error", done);
                        document.head.appendChild(link);
                    });
                });
            }

            // of SESSION_HOURS from sign-in; ticked, rememberDurationInDays (30). Sign out clears both.
            const SESSION_HOURS = 12;
            function shortenRemember() {
                try {
